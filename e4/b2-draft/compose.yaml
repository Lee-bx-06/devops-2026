services:
  draft:
    image: e4-draft:${STUDENT_ID:?run through make so STUDENT_ID is set}
    build:
      context: .
      dockerfile: services/draft/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DOCKER_BUILDKIT: "1"
      DOCKER_CONFIG: /tmp/.docker
      DRAFT_BUILD_TIMEOUT_SECONDS: "${DRAFT_BUILD_TIMEOUT_SECONDS:-180}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?run through make so DOCKER_GID is set}"
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
